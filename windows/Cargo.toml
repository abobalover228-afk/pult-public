[package]
name = "pult"
version = "2.4.1"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream", "multipart"] }
dirs = "5"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.23.1"
futures-util = "0.3.34"
rfd = "0.18.0"
uuid = { version = "1.29.2", features = ["v4"] }
jsonschema = { version = "0.61.2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
enigo = { version = "0.6.1", default-features = false }
xcap = "0.9.10"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }
image = { version = "0.25", default-features = false, features = ["png"] }
