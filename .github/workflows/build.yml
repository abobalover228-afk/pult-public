name: macOS Rust
on:
  push:
    paths: ['windows/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/build.yml']
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm test
      - run: cargo test --locked
      - run: npm run build:macos
      - run: node scripts/test-mcp-stdio.mjs target/release/pult
      - run: target/release/pult --smoke-test
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent 'target/release/bundle/macos/Пульт Rust.app' Pult-Rust-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pult-Rust-macOS-arm64
          path: windows/Pult-Rust-macOS-arm64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macOS-test-results
          path: windows/test-results
  # Когда публикуешь релиз, к нему прикрепляется Mac-архив: по нему обновляется Пульт Rust на Mac.
  publish:
    if: github.event_name == 'release'
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pult-Rust-macOS-arm64
      - run: gh release upload "$TAG" Pult-Rust-macOS-arm64.zip --clobber -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
