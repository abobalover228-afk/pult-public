name: Windows Rust
on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm test
      - run: cargo test --locked
      - run: npm run build:windows
      - run: node scripts/test-mcp-stdio.mjs target/release/pult.exe
      - name: Native window smoke test
        shell: pwsh
        run: |
          $app = Start-Process target/release/pult.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(30000)) {
            Stop-Process -Id $app.Id
            throw 'Pult UI startup timed out'
          }
          if ($app.ExitCode -ne 0) { throw "Pult UI failed: $($app.ExitCode)" }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Pult-Windows-x64
          path: |
            windows/target/release/bundle/nsis/*.exe
            windows/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-test-results
          path: windows/test-results
